name: Update RAPLA Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Download RAPLA and create ICS
        env:
          RAPLA_URL: ${{ secrets.RAPLA_URL }}
        run: |
          cat > rapla_to_ics.py <<'PY'
          import os
          import re
          import hashlib
          from datetime import datetime
          from urllib.parse import urlparse, parse_qsl, urlencode, urlunparse

          import requests
          from bs4 import BeautifulSoup


          RAPLA_URL = os.environ["RAPLA_URL"]
          YEAR = 2026


          def rapla_url():
              """Request 20 weeks so the calendar covers the semester."""
              p = urlparse(RAPLA_URL)
              q = dict(parse_qsl(p.query, keep_blank_values=True))

              q["pages"] = "20"

              return urlunparse(
                  (p.scheme, p.netloc, p.path, p.params,
                   urlencode(q), p.fragment)
              )


          def escape_ics(text):
              text = str(text or "")
              text = text.replace("\\", "\\\\")
              text = text.replace(";", "\\;")
              text = text.replace(",", "\\,")
              text = text.replace("\r\n", "\\n")
              text = text.replace("\n", "\\n")
              return text


          response = requests.get(
              rapla_url(),
              timeout=30,
              headers={"User-Agent": "Mozilla/5.0"}
          )
          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")

          calendar_title = soup.title.get_text(
              " ", strip=True
          ) if soup.title else "DHBW RAPLA"

          events = []


          for table in soup.select("table.week_table"):

              headers = table.select("td.week_header")

              dates = []

              for header in headers:
                  text = header.get_text(" ", strip=True)

                  match = re.search(
                      r"(Mo|Di|Mi|Do|Fr|Sa|So)\s+"
                      r"(\d{1,2})\.(\d{1,2})\.",
                      text
                  )

                  if not match:
                      continue

                  day = int(match.group(2))
                  month = int(match.group(3))

                  # Correct year around New Year
                  year = YEAR

                  if month == 1 and any(
                      d.month == 12 for d in dates
                  ):
                      year += 1

                  dates.append(
                      datetime(year, month, day).date()
                  )


              if not dates:
                  continue


              # RAPLA uses variable column spans.
              # Build a logical grid including rowspan/colspan.
              rows = table.find_all("tr")

              active_spans = {}

              for row in rows:

                  cells = row.find_all(["td", "th"], recursive=False)

                  if not cells:
                      continue

                  # Ignore header rows
                  if row.find("td", class_="week_header"):
                      continue

                  logical_col = 0

                  for cell in cells:

                      # Skip occupied columns from previous rowspans
                      while logical_col in active_spans:
                          active_spans[logical_col] -= 1
                          if active_spans[logical_col] <= 0:
                              del active_spans[logical_col]
                          logical_col += 1

                      classes = cell.get("class", [])

                      # First column = time label
                      if "week_times" in classes:
                          logical_col += 1
                          continue

                      colspan = int(cell.get("colspan", 1))
                      rowspan = int(cell.get("rowspan", 1))

                      if rowspan > 1:
                          for c in range(
                              logical_col,
                              logical_col + colspan
                          ):
                              active_spans[c] = rowspan - 1


                      if "week_block" in classes:

                          link = cell.find("a")

                          if link:

                              parts = list(
                                  link.stripped_strings
                              )

                              if parts:

                                  time_match = re.match(
                                      r"(\d{1,2}:\d{2})"
                                      r"\s*-\s*"
                                      r"(\d{1,2}:\d{2})",
                                      parts[0]
                                  )

                                  if time_match:

                                      start_time = time_match.group(1)
                                      end_time = time_match.group(2)

                                      title = " ".join(
                                          parts[1:]
                                      ).strip()

                                      resources = [
                                          x.get_text(
                                              " ", strip=True
                                          )
                                          for x in cell.select(
                                              "span.resource"
                                          )
                                      ]

                                      # Determine day from column.
                                      # RAPLA has ~3 columns per day.
                                      day_index = max(
                                          0,
                                          (logical_col - 1) // 3
                                      )

                                      if day_index < len(dates):

                                          event_date = dates[
                                              day_index
                                          ]

                                          # Find likely room
                                          room = ""

                                          for resource in resources:
                                              if (
                                                  "Hörsaal" in resource
                                                  or "Raum" in resource
                                                  or re.match(
                                                      r"^[A-Z]\s*\d+",
                                                      resource
                                                  )
                                              ):
                                                  room = resource
                                                  break

                                          start = datetime.strptime(
                                              f"{event_date} "
                                              f"{start_time}",
                                              "%Y-%m-%d %H:%M"
                                          )

                                          end = datetime.strptime(
                                              f"{event_date} "
                                              f"{end_time}",
                                              "%Y-%m-%d %H:%M"
                                          )

                                          identity = (
                                              f"{event_date}|"
                                              f"{start_time}|"
                                              f"{end_time}|"
                                              f"{title}|"
                                              f"{room}"
                                          )

                                          uid = hashlib.sha256(
                                              identity.encode(
                                                  "utf-8"
                                              )
                                          ).hexdigest()[:24]

                                          events.append({
                                              "uid": uid,
                                              "title": title,
                                              "start": start,
                                              "end": end,
                                              "room": room,
                                              "resources": resources,
                                          })

                      logical_col += colspan


              # decrement remaining rowspans
              for col in list(active_spans):
                  active_spans[col] -= 1
                  if active_spans[col] <= 0:
                      del active_spans[col]


          # Remove duplicates
          unique = {}

          for event in events:
              unique[event["uid"]] = event

          events = sorted(
              unique.values(),
              key=lambda x: x["start"]
          )


          lines = [
              "BEGIN:VCALENDAR",
              "VERSION:2.0",
              "PRODID:-//DHBW RAPLA Apple Calendar//DE",
              "CALSCALE:GREGORIAN",
              "METHOD:PUBLISH",
              "X-WR-CALNAME:" + escape_ics(calendar_title),
              "X-WR-TIMEZONE:Europe/Berlin",
          ]


          stamp = datetime.utcnow().strftime(
              "%Y%m%dT%H%M%SZ"
          )


          for event in events:

              description = " | ".join(
                  event["resources"]
              )

              lines.extend([
                  "BEGIN:VEVENT",
                  f'UID:{event["uid"]}@rapla.dhbw.de',
                  f"DTSTAMP:{stamp}",
                  "DTSTART;TZID=Europe/Berlin:"
                  + event["start"].strftime(
                      "%Y%m%dT%H%M%S"
                  ),
                  "DTEND;TZID=Europe/Berlin:"
                  + event["end"].strftime(
                      "%Y%m%dT%H%M%S"
                  ),
                  "SUMMARY:"
                  + escape_ics(event["title"]),
                  "LOCATION:"
                  + escape_ics(event["room"]),
                  "DESCRIPTION:"
                  + escape_ics(description),
                  "END:VEVENT",
              ])


          lines.append("END:VCALENDAR")


          with open(
              "calendar.ics",
              "w",
              encoding="utf-8",
              newline="\r\n"
          ) as f:
              f.write("\r\n".join(lines) + "\r\n")


          print(
              f"Created calendar.ics "
              f"with {len(events)} events."
          )

          if not events:
              raise RuntimeError(
                  "No RAPLA events were detected."
              )
          PY

          python rapla_to_ics.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar.ics

          if git diff --cached --quiet; then
            echo "Calendar unchanged."
          else
            git commit -m "Update RAPLA calendar"
            git push
          fi
