name: Diagnose RAPLA

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Download RAPLA page
        env:
          RAPLA_URL: ${{ secrets.RAPLA_URL }}
        run: |
          curl --fail --location --silent --show-error \
            "$RAPLA_URL" \
            -o rapla.html

          echo "Downloaded RAPLA page"
          echo "Size: $(wc -c < rapla.html) bytes"

      - name: Create safe diagnostic
        run: |
          python3 <<'PY'
          import re
          from html.parser import HTMLParser
          from collections import Counter

          html = open("rapla.html", encoding="utf-8", errors="replace").read()

          # Persönliche RAPLA-Zugangsdaten entfernen
          safe = re.sub(
              r'([?&]key=)[^&"\'\s<>]+',
              r'\1[REDACTED]',
              html,
              flags=re.I
          )
          safe = re.sub(
              r'([?&]salt=)[^&"\'\s<>]+',
              r'\1[REDACTED]',
              safe,
              flags=re.I
          )

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = Counter()
                  self.classes = Counter()
                  self.ids = Counter()
                  self.title = []
                  self.in_title = False

              def handle_starttag(self, tag, attrs):
                  self.tags[tag] += 1
                  attrs = dict(attrs)

                  if tag == "title":
                      self.in_title = True

                  for cls in attrs.get("class", "").split():
                      self.classes[cls] += 1

                  if attrs.get("id"):
                      self.ids[attrs["id"]] += 1

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title.append(data.strip())

          parser = Inspector()
          parser.feed(safe)

          with open("diagnostic.txt", "w", encoding="utf-8") as f:
              f.write("=== RAPLA DIAGNOSTIC ===\n\n")

              f.write("Title:\n")
              f.write(" ".join(x for x in parser.title if x) + "\n\n")

              f.write("Most common HTML tags:\n")
              for tag, count in parser.tags.most_common(30):
                  f.write(f"{tag}: {count}\n")

              f.write("\nClasses:\n")
              for cls, count in parser.classes.most_common(100):
                  f.write(f"{cls}: {count}\n")

              f.write("\nIDs:\n")
              for ident, count in parser.ids.most_common(100):
                  f.write(f"{ident}: {count}\n")

              f.write("\n=== SANITIZED HTML SAMPLE ===\n")
              f.write(safe[:30000])

          print("diagnostic.txt created")
          PY

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: rapla-diagnostic
          path: diagnostic.txt
          retention-days: 1
